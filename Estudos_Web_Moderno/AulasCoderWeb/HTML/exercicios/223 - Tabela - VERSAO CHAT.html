<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tabela</title>
  </head>

  <body>
    <!-- table = tabela inteira -->
    <table>

      <!-- tr = linha da tabela -->
      <tr>

        <!-- th = célula de cabeçalho -->
        <th>Nome</th>
        <th>Idade</th>

      </tr>

      <tr>

        <!-- td = célula normal com dados -->
        <td>Allan</td>
        <td>20</td>

      </tr>
    </table>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>

  <body>
    <!-- tabela inteira -->
    <table>

      <!-- linha do cabeçalho -->
      <tr>
        <th>Produto</th>
        <th>Preço</th>
      </tr>

      <!-- linha de dados -->
      <tr>
        <td>Mouse</td>
        <td>80</td>
      </tr>

      <!-- outra linha de dados -->
      <tr>
        <td>Teclado</td>
        <td>90</td>
      </tr>

    </table>
  </body>
</html>

<!-- Tarefa 2: -->

<!-- table = tabela inteira -->
<table>

  <!-- thead = agrupa o cabeçalho da tabela -->
  <thead>

    <!-- tr = linha -->
    <tr>

      <!-- th = célula de título -->
      <th>Produto</th>
      <th>Preço</th>

    </tr>
  </thead>

  <!-- tbody = agrupa os dados da tabela -->
  <tbody>

    <tr>
      <!-- td = célula normal -->
      <td>Mouse</td>
      <td>50</td>
    </tr>

    <tr>
      <td>Teclado</td>
      <td>50</td>
    </tr>

  </tbody>
</table>
