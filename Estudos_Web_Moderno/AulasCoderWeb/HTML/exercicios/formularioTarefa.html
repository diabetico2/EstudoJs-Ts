<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Formulário 02</title>

    <style>
      input,
      textarea,
      select {
        display: block;
        margin-bottom: 10px;
      }

      input[type="radio"],
      input[type="checkbox"] {
        display: inline;
      }
    </style>
  </head>

  <body>
    <form action="cadastro" method="get">
      <input type="text" name="nome" placeholder="Nome" />

      <input type="email" name="email" placeholder="Email" />

      <input type="password" name="senha" placeholder="Senha" />

      <textarea name="bio" placeholder="Biografia"></textarea>

      <p>Tipo:</p>

      <input type="radio" name="tipo" value="adm" /> Administrativo
      <input type="radio" name="tipo" value="professor" /> Professor
      <input type="radio" name="tipo" value="regular" /> Regular

      <br /><br />

      <input type="checkbox" name="ativo" /> Conta ativa

      <br /><br />

      <select name="estado">
        <option value="PR">Paraná</option>
        <option value="RJ">Rio de Janeiro</option>
        <option value="PA">Pará</option>
      </select>

      <select name="interesses" multiple size="3">
        <option value="JS">JavaScript</option>
        <option value="Java">Java</option>
        <option value="Py">Python</option>
      </select>

      <button type="submit">Enviar</button>
    </form>
  </body>
</html>
