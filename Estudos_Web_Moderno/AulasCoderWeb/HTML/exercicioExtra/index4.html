<ul>
  <li>
    <span onclick="mostrarEsconder(this)">Documentos</span>

    <ul>
      <li>trabalho.pdf</li>
      <li>curriculo.docx</li>
    </ul>
  </li>
</ul>

<script>
    function mostrarEsconder(elemento){
        const status = elemento.nextElementSibling
        if(status.style.display === 'none'){
            status.style.display = 'block'
        } else{
            status.style.display = 'none'
        }
    }
</script>
