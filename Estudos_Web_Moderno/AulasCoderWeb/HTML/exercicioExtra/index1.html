<span onclick="mostrarEsconder(this)">Clique aqui</span>

<p>Texto secreto!</p>

<script>
  function mostrarEsconder(elemento) {
    const status = elemento.nextElementSibling;
    if (status.style.display == "none") {
      status.style.display = "block";
    } else {
      status.style.display = "none";
    }
  }
</script>
