<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Anatomia CSS</title>

    <style>
      .selector {
        color: white;
        font-size: 30px;
        text-align: center;
        border: solid 5px navy;
        font-family: Helvetica, sans-serif;
        width: calc(100% - 40px);
        background-color: gray;
      }

      .selector:hover {
        background-color: orangered;
      }

      .selector::first-letter {
        font-size: 60px;
        font-weight: bold;
      }
    </style>
  </head>

  <body>
    <div class="selector">Conteúdo</div>
  </body>
</html>
